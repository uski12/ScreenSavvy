services:

    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
            args:
                REACT_APP_TMDB_API_KEY: ${REACT_APP_TMDB_API_KEY}
        ports:
            - "3000:80"
        depends_on:
            - backend

    backend:
        build:
            context: ./services/user-service
            dockerfile: Dockerfile
        ports:
            - "5000:5000"
        environment:
            MONGO_URI: mongodb://mongo:27017/users
        depends_on:
            - mongo

    mongo:
        image: mongo:7
        volumes:
            - mongo-data:/data/db

volumes:
    mongo-data:
